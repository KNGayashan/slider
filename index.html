<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zero Point Energy Drinks</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <div class="slider-container">
    <div class="slider">
      <!-- Slide 1: Quantum Fuel -->
      <div class="slide active">
        <div class="slide-bg quantum-fuel-bg"></div>
        <div class="slide-bottom-bg quantum-fuel-bottom-bg"></div>
        <div class="slide-particles" id="particles-1"></div>
        <div class="slide-content">
          <div class="product-image">
            <img src="./images/can.png" alt="Quantum Fuel Energy Drink" class="can-image" />
          </div>

          <div id="qf-accent-1" class="slide-accent berry">
            <img src="images/berry1.png" alt="berry1" />
          </div>

          <div id="qf-accent-2" class="slide-accent berry">
            <img src="images/berry2.png" alt="berry2" />
          </div>

          <div id="qf-accent-3" class="slide-accent berry">
            <img src="images/berry3.png" alt="berry3" />
          </div>

          <div id="qf-accent-4" class="slide-accent berry">
            <img src="images/berry4.png" alt="berry4" />
          </div>

          <div id="qf-accent-5" class="slide-accent berry">
            <img src="images/berry5.png" alt="berry5" />
          </div>

          <div id="qf-accent-6" class="slide-accent orange">
            <img src="/images/orange11.png" alt="orange11" />
          </div>

          <div id="qf-accent-7" class="slide-accent orange">
            <img src="/images/orange21.png" alt="orange21" />
          </div>

          <div id="qf-accent-8" class="slide-accent">
            <img src="/images/orange31.png" alt="orange31" />
          </div>
        </div>
      </div>

      <!-- Slide 2: Plasma Shock -->
      <div class="slide">
        <div class="slide-bg plasma-shock-bg"></div>
        <div class="slide-bottom-bg plasma-shock-bottom-bg"></div>
        <div class="slide-particles" id="particles-2"></div>
        <div class="slide-content">
          <div class="product-image">
            <img src="./images/can.png" alt="Plasma Shock Energy Drink" class="can-image" />
          </div>
          <div id="ps-accent-1" class="slide-accent orange">
            <img src="images/citrus1.png" alt="Electric Leaf" />
          </div>
          <div id="ps-accent-2" class="slide-accent">
            <img src="images/citrus2.png" alt="Raspberry" />
          </div>
          <div id="ps-accent-3" class="slide-accent">
            <img src="images/citrus3.png" alt="Raspberry" />
          </div>
        </div>
      </div>

      <!-- Slide 3: Titan Burn -->
      <div class="slide">
        <div class="slide-bg titan-burn-bg"></div>
        <div class="slide-bottom-bg titan-burn-bottom-bg"></div>
        <div class="slide-particles" id="particles-3"></div>
        <div class="slide-content">
          <div class="product-image">
            <img src="./images/can.png" alt="Titan Burn Energy Drink" class="can-image" />
          </div>
          <div id="tb-accent-1" class="slide-accent orange">
            <img src="/images/n-berry1.png" alt="Cinnamon Stick" />
          </div>
          <div id="tb-accent-2" class="slide-accent orange">
            <img src="/images/n-berry2.png" alt="Cherry" />
          </div>
          <div id="tb-accent-3" class="slide-accent berry">
            <img src="/images/n-berry3.png" alt="Cinnamon Stick" />
          </div>
          <div id="tb-accent-4" class="slide-accent berry">
            <img src="/images/n-berry6.png" alt="Cherry" />
          </div>
          <div id="tb-accent-5" class="slide-accent">
            <img src="/images/n-berry5.png" alt="Cherry" />
          </div>
        </div>
      </div>

      <!-- Slide 4: Nebula Berry -->
      <div class="slide">
        <div class="slide-bg nebula-berry-bg"></div>
        <div class="slide-bottom-bg nebula-berry-bottom-bg"></div>
        <div class="slide-particles" id="particles-4"></div>
        <div class="slide-content">
          <div class="product-image">
            <img src="./images/can.png" alt="Nebula Berry Energy Drink" class="can-image" />
          </div>
          <div id="nb-accent-1" class="slide-accent orange">
            <img src="/images/lime1.png" alt="Star Leaf" />
          </div>
          <div id="nb-accent-2" class="slide-accent orange">
            <img src="/images/mint1.png" alt="Mixed Berries" />
          </div>
          <div id="nb-accent-3" class="slide-accent leaf">
            <img src="/images/lime2.png" alt="Star Leaf" />
          </div>
          <div id="nb-accent-4" class="slide-accent fruit">
            <img src="/images/mint2.png" alt="Mixed Berries" />
          </div>
        </div>
      </div>
    </div>

    <!-- Slider Navigation -->
    <div class="slider-nav">
      <div class="slider-nav-item active" data-slide="0"></div>
      <div class="slider-nav-item" data-slide="1"></div>
      <div class="slider-nav-item" data-slide="2"></div>
      <div class="slider-nav-item" data-slide="3"></div>
    </div>

    <!-- Slider Arrows -->
    <div class="slide-arrow prev">
      <svg viewBox="0 0 24 24">
        <path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z" />
      </svg>
    </div>
    <div class="slide-arrow next">
      <svg viewBox="0 0 24 24">
        <path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z" />
      </svg>
    </div>
  </div>

  <script src="/app.js"></script>
</body>

</html>
